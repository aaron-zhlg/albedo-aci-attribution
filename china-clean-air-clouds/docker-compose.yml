services:
  prep:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: albedo/china-clean-air-clouds:latest
    env_file: .env
    volumes:
      # DATA_DIR (set in .env) is the host folder that receives the data, e.g. D:/climate-data/china
      - ${DATA_DIR:-./data}:/data
      - ./scripts:/work/scripts
    working_dir: /work

  jupyter:
    image: albedo/china-clean-air-clouds:latest
    env_file: .env
    volumes:
      - ${DATA_DIR:-./data}:/data
      - .:/work
    working_dir: /work
    ports:
      - "8888:8888"
    command: jupyter lab --ip=0.0.0.0 --no-browser --allow-root
